<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123b2c"><meta name="description" content="Controle simples de gastos, entradas, contas fixas e resumos financeiros.">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<title>Meu Bolso — Finanças</title>
<style>
:root{--green:#123b2c;--green2:#1f6b4c;--mint:#dff5e8;--bg:#f4f7f5;--ink:#17231d;--muted:#718078;--line:#e5ece7;--red:#d94c4c;--yellow:#f4bd4f;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:850px;margin:auto;min-height:100dvh;padding-bottom:86px}.top{background:var(--green);color:#fff;padding:22px 18px 26px;border-radius:0 0 26px 26px}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:21px;margin:0;letter-spacing:-.5px}.brand small{opacity:.75}.monthbar{display:flex;align-items:center;gap:10px;margin-top:22px}.monthbar input{background:#ffffff18;border:1px solid #ffffff30;color:#fff;border-radius:10px;padding:8px;max-width:170px}.balance-label{font-size:13px;opacity:.8;margin-top:18px}.balance{font-size:34px;font-weight:750;letter-spacing:-1px;margin:3px 0 17px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sumcard{background:#ffffff12;border:1px solid #ffffff20;border-radius:15px;padding:12px}.sumcard span{display:block;font-size:12px;opacity:.78}.sumcard strong{display:block;font-size:17px;margin-top:5px}.content{padding:18px}.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.pagehead h2{font-size:20px;margin:0}.primary{border:0;background:var(--green2);color:white;border-radius:12px;padding:11px 14px;font-weight:650}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(8px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom));z-index:5;max-width:850px;margin:auto}.tab{border:0;background:transparent;color:var(--muted);font-size:11px;padding:6px 1px;display:flex;align-items:center;gap:3px;flex-direction:column}.tab .ico{font-size:20px}.tab.active{color:var(--green2);font-weight:750}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:15px;margin-bottom:12px}.card h3{margin:0 0 12px;font-size:15px}.item{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0;padding-bottom:0}.dot{width:40px;height:40px;display:grid;place-items:center;background:var(--mint);border-radius:13px;font-size:19px;flex-shrink:0}.itemmain{min-width:0;flex:1}.itemmain strong{display:block;font-size:14px;overflow-wrap:anywhere}.itemmain small{color:var(--muted)}.amount{font-weight:750;white-space:nowrap}.negative{color:var(--red)}.positive{color:var(--green2)}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:4px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;min-width:0}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:650}.field input,.field select{width:100%;border:1px solid #dce5df;border-radius:11px;padding:12px;background:#fff}.modal{position:fixed;inset:0;background:#10251c80;display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}.modal.open{display:flex}.dialog{background:var(--bg);width:min(100%,540px);max-height:92dvh;overflow:auto;border-radius:22px;padding:18px}.dialoghead{display:flex;justify-content:space-between;align-items:center}.dialoghead h3{margin:0}.close{border:0;background:#e8efea;border-radius:50%;width:34px;height:34px;font-size:20px}.formactions{display:flex;gap:9px;margin-top:18px}.formactions button{flex:1}.chartbox{height:210px;display:flex;align-items:end;gap:8px;padding:12px 2px 24px;border-bottom:1px solid var(--line)}.barcol{flex:1;height:100%;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:6px;min-width:0}.bar{width:min(28px,75%);min-height:3px;border-radius:7px 7px 2px 2px;background:var(--green2)}.bar.income{background:#55b98a}.bar.expense{background:#e16d65}.barcol small{font-size:10px;color:var(--muted);white-space:nowrap}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:9px 0}.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px}.yearselect{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.fixedrow{display:flex;align-items:center;gap:9px}.fixedrow input[type=checkbox]{width:18px;height:18px;accent-color:var(--green2)}.pill{background:#eef7f1;color:var(--green2);border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700}.danger{color:var(--red);border-color:#f3d2d0}.note{font-size:12px;color:var(--muted);line-height:1.5}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#173e2e;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:20;box-shadow:0 5px 25px #0002}
@media(min-width:650px){.top{padding:26px 28px 30px}.content{padding:24px 28px}.modal{align-items:center}.summary{max-width:550px}.balance{font-size:40px}}
</style></head>
<body><div class="app">
<header class="top">
 <div class="brand"><div><h1>🌿 Meu Bolso</h1><small>Seu dinheiro, mais organizado</small></div><button class="secondary" id="installBtn" style="display:none">＋ Instalar</button></div>
 <div class="monthbar"><span>Período</span><input id="monthPick" type="month"></div>
 <div class="balance-label">Saldo do período</div><div class="balance" id="balance">R$ 0,00</div>
 <div class="summary"><div class="sumcard"><span>↗ Entradas</span><strong id="incomeTotal">R$ 0,00</strong></div><div class="sumcard"><span>↘ Gastos</span><strong id="expenseTotal">R$ 0,00</strong></div></div>
</header>
<main class="content" id="view"></main>
<nav class="tabs">
 <button class="tab active" data-tab="inicio"><span class="ico">⌂</span>Resumo</button>
 <button class="tab" data-tab="gastos"><span class="ico">↘</span>Gastos</button>
 <button class="tab" data-tab="entradas"><span class="ico">↗</span>Entradas</button>
 <button class="tab" data-tab="fixas"><span class="ico">▣</span>Contas fixas</button>
 <button class="tab" data-tab="graficos"><span class="ico">▥</span>Gráficos</button>
</nav></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h3 id="modalTitle">Novo lançamento</h3><button class="close" id="closeModal">×</button></div><form id="entryForm"><div id="formFields"></div><div class="formactions"><button type="button" class="secondary" id="cancelForm">Cancelar</button><button class="primary" type="submit">Salvar</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0);
const today=new Date(), pad=n=>String(n).padStart(2,'0'), currentMonth=`${today.getFullYear()}-${pad(today.getMonth()+1)}`;
$('#monthPick').value=currentMonth;
let tab='inicio', transactions=JSON.parse(localStorage.getItem('mb_transactions')||'[]'), bills=JSON.parse(localStorage.getItem('mb_bills')||'[]'), installPrompt=null;
const categories=['Alimentação','Moradia','Transporte','Saúde','Lazer','Compras','Educação','Salário','Freelance','Investimentos','Outros'];
function persist(){localStorage.setItem('mb_transactions',JSON.stringify(transactions));localStorage.setItem('mb_bills',JSON.stringify(bills));render()}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2300)}
function isMonth(x,m=$('#monthPick').value){return x.date?.slice(0,7)===m}
function totals(list){return list.reduce((a,x)=>{a[x.type]=(a[x.type]||0)+Number(x.amount);return a},{})}
function fmtDate(d){if(!d)return '';let [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function iconFor(x){return x.type==='entrada'?'↗':x.type==='gasto'?'↘':'▣'}
function row(x, fixed=false){return `<div class="item"><div class="dot">${iconFor(x)}</div><div class="itemmain"><strong>${esc(x.name)}</strong><small>${esc(x.category||'Conta fixa')} · ${fmtDate(x.date||'')}</small></div><div class="amount ${x.type==='entrada'?'positive':'negative'}">${x.type==='entrada'?'+':'−'} ${money(x.amount)}</div><button class="secondary" data-del="${x.id}" aria-label="Excluir">×</button></div>`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(type, item=null){$('#modalTitle').textContent=item?'Editar lançamento':({gasto:'Novo gasto',entrada:'Nova entrada',fixa:'Nova conta fixa'}[type]||'Novo lançamento');$('#formFields').innerHTML=`
<div class="field"><label>Descrição</label><input name="name" required maxlength="70" placeholder="Ex.: supermercado" value="${esc(item?.name||'')}"></div>
<div class="field"><label>Valor (R$)</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0,00" value="${item?.amount||''}"></div>
<div class="field"><label>Categoria</label><select name="category">${categories.map(c=>`<option ${item?.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="field"><label>Data</label><input name="date" type="date" required value="${item?.date||new Date().toISOString().slice(0,10)}"></div>
${type==='fixa'?`<div class="field"><label>Dia do vencimento</label><input name="day" type="number" min="1" max="31" value="${item?.day||1}" required></div><div class="field"><label>Tipo</label><select name="billType"><option value="gasto">Despesa</option><option value="entrada">Entrada recorrente</option></select></div>`:''}
<div class="field"><label>Observação (opcional)</label><input name="note" maxlength="120" placeholder="Detalhes"></div>`;
$('#entryForm').dataset.type=type;$('#entryForm').dataset.id=item?.id||'';$('#modal').classList.add('open')}
function closeForm(){$('#modal').classList.remove('open')}
$('#closeModal').onclick=$('#cancelForm').onclick=closeForm;
$('#entryForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=e.target.dataset.type,id=e.target.dataset.id||Date.now().toString();let obj={id,name:f.get('name').trim(),amount:Number(f.get('amount')),category:f.get('category'),date:f.get('date'),note:f.get('note')};if(type==='fixa'){obj.day=Number(f.get('day'));obj.billType=f.get('billType');bills=bills.filter(x=>x.id!==id);bills.push(obj)}else{obj.type=type;transactions=transactions.filter(x=>x.id!==id);transactions.push(obj)}closeForm();persist();toast('Salvo com sucesso!')};
$('#monthPick').onchange=render;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
document.addEventListener('click',e=>{let d=e.target.closest('[data-del]');if(d){let id=d.dataset.del;transactions=transactions.filter(x=>x.id!==id);bills=bills.filter(x=>x.id!==id);persist();toast('Item excluído')};let a=e.target.closest('[data-add]');if(a)openForm(a.dataset.add);let paid=e.target.closest('[data-paid]');if(paid){let b=bills.find(x=>x.id===paid.dataset.paid);if(!b)return;let month=$('#monthPick').value;let date=`${month}-${pad(Math.min(b.day, new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate()))}`;if(!transactions.some(t=>t.billId===b.id&&t.date===date)){transactions.push({id:Date.now().toString(),billId:b.id,name:b.name,amount:b.amount,category:b.category,date,type:b.billType||'gasto'});persist();toast('Conta marcada como paga') }else toast('Esta conta já foi lançada neste mês')}});
function chart(data, keyLabels, max, colorClass=''){return `<div class="chartbox">${data.map(d=>`<div class="barcol"><strong style="font-size:10px">${d.value?money(d.value).replace('R$ ',''):''}</strong><div class="bar ${colorClass}" style="height:${Math.max(d.value?3:0,max?d.value/max*68:0)}%"></div><small>${d.label}</small></div>`).join('')}</div>`}
function render(){let month=$('#monthPick').value||currentMonth, all=transactions.filter(x=>isMonth(x,month)), t=totals(all), inc=t.entrada||0, exp=t.gasto||0;
$('#balance').textContent=money(inc-exp);$('#incomeTotal').textContent=money(inc);$('#expenseTotal').textContent=money(exp);
const list=(xs)=>xs.length?xs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>row(x)).join(''):`<div class="empty"><b>Nenhum lançamento por aqui</b>Adicione seu primeiro registro para começar.</div>`;
let view=$('#view');
if(tab==='inicio'){let recent=all.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);view.innerHTML=`<div class="pagehead"><h2>Visão geral</h2><span class="pill">${fmtDate(month+'-01').slice(3)}</span></div><div class="card"><h3>Como está seu mês?</h3><div style="display:flex;justify-content:space-between;gap:12px"><div><small style="color:var(--muted)">Disponível</small><div style="font-size:24px;font-weight:800">${money(inc-exp)}</div></div><div style="text-align:right"><small style="color:var(--muted)">Taxa de gastos</small><div style="font-size:22px;font-weight:800">${inc?Math.round(exp/inc*100)+'%':'—'}</div></div></div><div style="height:8px;background:#eaf0ec;border-radius:9px;margin-top:13px;overflow:hidden"><div style="height:100%;width:${inc?Math.min(100,exp/inc*100):0}%;background:${exp>inc?'var(--red)':'var(--green2)'};border-radius:9px"></div></div></div><div class="pagehead"><h2>Últimos lançamentos</h2><button class="secondary" data-add="gasto">＋ Novo gasto</button></div><div class="card">${list(recent)}</div><div class="card"><h3>Atalhos</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" data-add="entrada">＋ Entrada</button><button class="secondary" data-add="gasto">＋ Gasto</button><button class="secondary" data-add="fixa">＋ Conta fixa</button></div></div>`}
if(tab==='gastos'||tab==='entradas'){let type=tab==='gastos'?'gasto':'entrada', xs=all.filter(x=>x.type===type);view.innerHTML=`<div class="pagehead"><h2>${tab==='gastos'?'Gastos':'Entradas'}</h2><button class="primary" data-add="${type}">＋ Adicionar</button></div><div class="card"><div class="filters"><select id="catFilter"><option value="">Todas as categorias</option>${categories.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="entriesList">${list(xs)}</div><p class="note">Total no período: <b>${money(xs.reduce((s,x)=>s+x.amount,0))}</b></p></div>`;$('#catFilter').onchange=()=>{$('#entriesList').innerHTML=list(xs.filter(x=>!$('#catFilter').value||x.category===$('#catFilter').value))}}
if(tab==='fixas'){view.innerHTML=`<div class="pagehead"><h2>Contas fixas</h2><button class="primary" data-add="fixa">＋ Adicionar</button></div><div class="card"><p class="note">Cadastre aluguel, internet, mensalidades e outras contas recorrentes. Use “Lançar no mês” para incluir no resumo do período.</p>${bills.length?bills.slice().sort((a,b)=>a.day-b.day).map(b=>`<div class="item"><div class="dot">▣</div><div class="itemmain"><strong>${esc(b.name)}</strong><small>Dia ${b.day} · ${esc(b.category)}</small></div><div class="amount">${money(b.amount)}</div><button class="secondary" data-paid="${b.id}">Lançar</button><button class="secondary" data-del="${b.id}">×</button></div>`).join(''):`<div class="empty"><b>Nenhuma conta fixa cadastrada</b>Adicione suas contas para organizar os vencimentos.</div>`}</div>`}
if(tab==='graficos'){let year=Number(month.slice(0,4)), months=Array.from({length:12},(_,i)=>{let m=`${year}-${pad(i+1)}`, xs=transactions.filter(x=>isMonth(x,m));return {label:['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][i],income:xs.filter(x=>x.type==='entrada').reduce((s,x)=>s+x.amount,0),expense:xs.filter(x=>x.type==='gasto').reduce((s,x)=>s+x.amount,0)}});let max=Math.max(1,...months.flatMap(x=>[x.income,x.expense]));view.innerHTML=`<div class="pagehead"><h2>Gráficos e resumos</h2><select class="yearselect" id="yearPick">${[year-2,year-1,year,year+1].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></div><div class="card"><h3>Resumo mensal — entradas x gastos</h3><div class="legend"><span><i style="background:#55b98a"></i>Entradas</span><span><i style="background:#e16d65"></i>Gastos</span></div><div class="chartbox">${months.map(m=>`<div class="barcol"><div style="height:100%;display:flex;align-items:end;gap:3px"><div class="bar income" title="Entradas: ${money(m.income)}" style="height:${m.income/max*75}%;width:12px"></div><div class="bar expense" title="Gastos: ${money(m.expense)}" style="height:${m.expense/max*75}%;width:12px"></div></div><small>${m.label}</small></div>`).join('')}</div><p class="note">Os gráficos usam os lançamentos salvos neste aparelho.</p></div><div class="card"><h3>Fechamento de ${year}</h3><div class="item"><div class="itemmain"><strong>Total de entradas</strong></div><div class="amount positive">${money(months.reduce((s,m)=>s+m.income,0))}</div></div><div class="item"><div class="itemmain"><strong>Total de gastos</strong></div><div class="amount negative">${money(months.reduce((s,m)=>s+m.expense,0))}</div></div><div class="item"><div class="itemmain"><strong>Saldo anual</strong></div><div class="amount">${money(months.reduce((s,m)=>s+m.income-m.expense,0))}</div></div></div><div class="card"><h3>Detalhe por mês</h3>${months.map(m=>`<div class="item"><div class="itemmain"><strong>${m.label}</strong><small>Entradas ${money(m.income)} · Gastos ${money(m.expense)}</small></div><div class="amount ${m.income-m.expense>=0?'positive':'negative'}">${money(m.income-m.expense)}</div></div>`).join('')}</div>`;$('#yearPick').onchange=()=>{$('#monthPick').value=$('#yearPick').value+'-'+month.slice(5,7);render()}}
}
render();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn').style.display='block'});
$('#installBtn').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else toast('Use o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.')};
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
